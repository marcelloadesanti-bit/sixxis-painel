# Ping periodico da rota de lembretes do Calendario. O plano Vercel Hobby
# so permite cron nativo 1x/dia, entao esse workflow assume o papel de
# "cron externo" rodando a cada 5 minutos (o minimo permitido pelo
# agendador do GitHub Actions).
#
# Requer dois secrets no repositorio (Settings > Secrets and variables >
# Actions):
#   SITE_URL     -- ex: https://sixxis-painel.vercel.app (sem barra no fim)
#   CRON_SECRET  -- o mesmo valor configurado na Vercel como variavel de
#                   ambiente CRON_SECRET
name: Lembretes do Calendario

on:
  schedule:
      - cron: "*/5 * * * *"
        workflow_dispatch: {}

        jobs:
          chamar-cron:
              runs-on: ubuntu-latest
                  steps:
                        - name: Chamar rota de lembretes
                                run: |
                                          curl -sS -X GET "${{ secrets.SITE_URL }}/api/cron/lembretes-calendario" \
                                                      -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                                                                  --fail
